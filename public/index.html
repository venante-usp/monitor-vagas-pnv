<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#183574">
  <title>Monitor de vagas · PNV</title>
  <style>
    :root{--bg:#f3f6fb;--card:#fff;--ink:#14213a;--muted:#66748b;--line:#dde5f0;--navy:#132c63;--blue:#3d67d5;--soft:#edf2ff;--ok:#157a4b;--warn:#b66b00;--bad:#c5462b;--shadow:0 15px 38px rgba(20,38,77,.09)}
    *{box-sizing:border-box} body{margin:0;min-width:320px;background:var(--bg);color:var(--ink);font:14px/1.4 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    .wrap{width:min(1320px,calc(100% - 36px));margin:28px auto 48px}.hero{background:radial-gradient(circle at 100% 0,rgba(137,160,255,.34),transparent 36%),linear-gradient(135deg,#10234b,#193c89 57%,#315dcc);color:#fff;padding:28px;border-radius:22px;box-shadow:0 19px 46px rgba(19,45,103,.24)}
    .top{display:flex;justify-content:space-between;gap:22px;align-items:flex-start}.eyebrow{font-size:11px;letter-spacing:.13em;font-weight:800;color:#bdccff}.hero h1{font-size:clamp(25px,3.1vw,35px);letter-spacing:-.04em;line-height:1.06;margin:6px 0 9px}.sub{margin:0;color:#d9e3ff;font-size:13px}.server{display:flex;align-items:center;gap:8px;margin-top:13px;font-size:13px;color:#dce6ff}.dot{height:10px;width:10px;border-radius:50%;background:#69dda0;box-shadow:0 0 0 4px rgba(105,221,160,.16)}.dot.work{background:#ffcf5a}.dot.err{background:#ff927e}.btn{border:0;border-radius:10px;background:#fff;color:#183469;font:700 13px inherit;padding:10px 14px;cursor:pointer;min-height:40px}.btn:hover{background:#edf2ff}.timers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:24px}.timer{padding:13px 14px;border:1px solid rgba(255,255,255,.18);border-radius:13px;background:rgba(5,18,55,.20)}.timer span{display:block;font-size:10px;font-weight:800;letter-spacing:.10em;color:#bdccff}.timer strong{display:block;font-size:21px;font-variant-numeric:tabular-nums;margin:4px 0 1px}.timer small{font-size:11px;color:#dae5ff}
    .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);margin:18px 0;padding:13px 16px;border-radius:14px;box-shadow:0 4px 12px rgba(20,38,77,.04)}.count{font-weight:750}.stamp{font-size:12px;color:var(--muted);text-align:right}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.filter{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 13px;color:#506078;font:650 12px inherit;cursor:pointer}.filter.active{background:var(--blue);border-color:var(--blue);color:#fff}.notice{display:none;margin-bottom:16px;border-radius:12px;padding:11px 14px;background:#fff7ed;color:#9d4900;border:1px solid #fed7aa}.notice.show{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}.course{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 6px 17px rgba(20,38,77,.045)}.course-head{padding:17px 17px 13px;border-left:5px solid var(--blue);border-bottom:1px solid var(--line)}.code{font-weight:850;font-size:17px;letter-spacing:-.01em}.name{margin-top:3px;font-size:12px;color:var(--muted);min-height:32px}.people{display:flex;align-items:baseline;gap:7px;margin-top:12px}.people strong{font-size:23px;letter-spacing:-.04em}.people span{color:var(--muted);font-size:12px}.breakdown{margin-top:3px;font-size:11px;color:#718096}.classes{padding:10px 12px 12px}.class{padding:11px 8px;border-bottom:1px solid #edf1f7}.class:last-child{border-bottom:0}.class-top{display:flex;justify-content:space-between;gap:9px}.schedule{font-weight:750;font-size:12px}.tag{font-size:11px;color:#61708a;margin-top:3px}.vacancies{font-size:12px;font-weight:700;margin-top:7px}.status{display:inline-block;margin-left:5px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}.status.ok{color:var(--ok)}.status.warn{color:var(--warn)}.status.bad{color:var(--bad)}.details{font-size:11px;color:#728097;margin-top:3px}.empty{padding:52px 16px;text-align:center;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:16px}.footer{text-align:center;color:#8a96a8;font-size:11px;margin-top:24px}
    @media(max-width:720px){.wrap{width:min(100% - 20px,1320px);margin-top:10px}.hero{border-radius:17px;padding:21px}.top{flex-direction:column}.timers{grid-template-columns:1fr}.bar{align-items:flex-start;flex-direction:column}.stamp{text-align:left}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <div class="top">
        <div>
          <div class="eyebrow">JÚPITER · PNV</div>
          <h1>Monitor de vagas</h1>
          <p class="sub">Dados consultados pelo servidor.</p>
          <div class="server"><i class="dot" id="dot"></i><span id="serverStatus">Carregando dados</span></div>
        </div>
        <button class="btn" id="reload">↻ Recarregar dados</button>
      </div>
      <div class="timers">
        <div class="timer"><span>AGORA</span><strong id="clock">--:--:--</strong><small>horário de Brasília</small></div>
        <div class="timer"><span>ATUALIZAÇÃO CURTA</span><strong id="short">--</strong><small id="shortDetail">dados ofertados</small></div>
        <div class="timer"><span>CONSULTA COMPLETA</span><strong id="full">--</strong><small id="fullDetail">lista atual do Júpiter</small></div>
      </div>
    </section>

    <section class="bar"><div class="count" id="count">Carregando…</div><div class="stamp" id="stamp">—</div></section>
    <div class="notice" id="notice"></div>
    <nav class="filters" aria-label="Filtros de disponibilidade">
      <button class="filter active" data-filter="todos">Todas</button>
      <button class="filter" data-filter="disponiveis">Com vagas</button>
      <button class="filter" data-filter="poucos">Poucas vagas</button>
      <button class="filter" data-filter="lotadas">Sem vagas</button>
    </nav>
    <section id="content"><div class="empty">Consultando dados armazenados…</div></section>
    <div class="footer">Fonte: Júpiter · atualização automática no servidor</div>
  </main>
<script>
  let disciplinas=[]; let meta={}; let filtro='todos'; let timer=null;
  const brt={timeZone:'America/Sao_Paulo',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false};
  const formatTime=(ms)=>ms?new Intl.DateTimeFormat('pt-BR',brt).format(new Date(ms)):'—';
  const number=(n)=>new Intl.NumberFormat('pt-BR').format(n||0);
  const totalPessoas=(d)=>{
    const grupos=new Map();
    for(const t of d.turmas||[]){const g=t.grupoTurma||t.codigo;if(!grupos.has(g))grupos.set(g,new Map());const byCode=grupos.get(g);if(!byCode.has(t.codigo))byCode.set(t.codigo,[]);byCode.get(t.codigo).push(t)}
    let out={inscritos:0,pendentes:0,matriculados:0};
    for(const [grupo,byCode] of grupos){const candidate=byCode.get(grupo)?[byCode.get(grupo)]:[...byCode.values()];let best={inscritos:0,pendentes:0,matriculados:0};for(const list of candidate){const s=list.reduce((a,t)=>({inscritos:a.inscritos+(+t.inscritos||0),pendentes:a.pendentes+(+t.pendentes||0),matriculados:a.matriculados+(+t.matriculados||0)}),{inscritos:0,pendentes:0,matriculados:0});if(s.inscritos+s.pendentes+s.matriculados>best.inscritos+best.pendentes+best.matriculados)best=s}out.inscritos+=best.inscritos;out.pendentes+=best.pendentes;out.matriculados+=best.matriculados}
    return {...out,pessoas:out.inscritos+out.pendentes+out.matriculados};
  };
  const status=(t)=>{if(!t.total||t.disponiveis<=0)return 'lotadas';if(t.disponiveis/t.total<=.2)return 'poucos';return 'disponiveis'};
  function escapeHtml(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]))}
  function render(){
    const list=[...disciplinas].sort((a,b)=>totalPessoas(b).pessoas-totalPessoas(a).pessoas||a.codigo.localeCompare(b.codigo)).filter(d=>filtro==='todos'||d.turmas.some(t=>status(t)===filtro));
    document.getElementById('count').textContent=`${number(list.length)} disciplina${list.length===1?'':'s'} com turma ofertada`;
    const root=document.getElementById('content');
    if(!list.length){root.innerHTML='<div class="empty">Nenhuma disciplina corresponde ao filtro.</div>';return}
    root.innerHTML='<div class="grid">'+list.map(d=>{const p=totalPessoas(d);return `<article class="course"><header class="course-head"><div class="code">${escapeHtml(d.codigo)}</div><div class="name">${escapeHtml(d.nome)}</div><div class="people"><strong>${number(p.pessoas)}</strong><span>pessoas registradas</span></div><div class="breakdown">Inscritos ${number(p.inscritos)} · Pendentes ${number(p.pendentes)} · Matriculados ${number(p.matriculados)}</div></header><div class="classes">${d.turmas.map(t=>{const st=status(t),pct=t.total?Math.round((t.ocupadas/t.total)*100):0;return `<div class="class"><div class="class-top"><div><div class="schedule">${escapeHtml(t.horario||'Horário não informado')}</div><div class="tag">Turma ${escapeHtml(t.codigo)} · ${escapeHtml(t.categoria)}</div></div><div class="status ${st==='disponiveis'?'ok':st==='poucos'?'warn':'bad'}">${st==='disponiveis'?'vagas':st==='poucos'?'poucas':'lotada'}</div></div><div class="vacancies">${number(t.disponiveis)} disponíveis de ${number(t.total)} <span class="tag">· ${pct}% ocupado</span></div><div class="details">Inscritos ${number(t.inscritos)} · Pendentes ${number(t.pendentes)} · Matriculados ${number(t.matriculados)}</div></div>`}).join('')}</div></article>`}).join('')+'</div>';
  }
  function human(ms){if(ms==null||ms<0)return '—';const s=Math.ceil(ms/1000),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60;if(h)return `${h}h ${String(m).padStart(2,'0')}m`;if(m)return `${m}m ${String(ss).padStart(2,'0')}s`;return `${ss}s`}
  function updateTimers(){const now=Date.now();document.getElementById('clock').textContent=new Intl.DateTimeFormat('pt-BR',brt).format(new Date(now));document.getElementById('short').textContent=human((meta.proximaAtualizacaoCurta||0)-now);document.getElementById('full').textContent=human((meta.proximaConsultaCompleta||0)-now)}
  function refreshMeta(){const full=meta.fullScan;document.getElementById('stamp').textContent=meta.ultimaAtualizacao?`Última atualização: ${formatTime(meta.ultimaAtualizacao)}`:'Sem dados armazenados';document.getElementById('serverStatus').textContent=full?.emAndamento?`Sincronização diária: ${full.concluidas}/${full.total}`:'Monitor ativo';document.getElementById('dot').className='dot '+(full?.emAndamento?'work':'');document.getElementById('shortDetail').textContent=full?.emAndamento?'retoma após a sincronização':'disciplinas ofertadas';document.getElementById('fullDetail').textContent=full?.emAndamento?`${full.concluidas}/${full.total} consultadas`:'lista atual do Júpiter';const note=document.getElementById('notice');if(meta.ultimoErro?.mensagem){note.textContent=meta.ultimoErro.mensagem;note.classList.add('show')}else note.classList.remove('show')}
  async function load(){const button=document.getElementById('reload');button.disabled=true;try{const r=await fetch('/api/monitor',{cache:'no-store'});if(!r.ok)throw new Error('Não foi possível ler os dados do monitor.');const data=await r.json();disciplinas=data.disciplinas||[];meta=data.meta||{};refreshMeta();render();updateTimers()}catch(e){document.getElementById('dot').className='dot err';document.getElementById('serverStatus').textContent='Dados indisponíveis';document.getElementById('content').innerHTML=`<div class="empty">${escapeHtml(e.message)}</div>`}finally{button.disabled=false}}
  document.getElementById('reload').addEventListener('click',load);document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>{filtro=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render()}));
  load();timer=setInterval(updateTimers,1000);setInterval(load,60*1000);
</script>
</body>
</html>
